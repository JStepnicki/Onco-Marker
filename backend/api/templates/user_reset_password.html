<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <style>
        .token {
            font-weight: bold;
            color: blue; /* Możesz zmienić kolor */
        }
    </style>
</head>
<body>
    <p>Hello {{ username }},</p>
    <p>You have requested to reset your password. Here is your password reset token:</p>
    <p class="token">{{ reset_password_token }}</p>
    <p>If you did not request this, please ignore this email.</p>
</body>
</html>
